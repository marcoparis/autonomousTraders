# Render Blueprint: dashboard e API, sul piano gratuito.
#
#   - frontend Vite come Static Site (sempre acceso)
#   - API FastAPI in sola lettura come Web Service free
#
# Il motore con gli agenti non gira qui: lo lancia GitHub Actions
# (.github/workflows/trading-cycle.yml), che poi committa data/accounts.db.
# Render vede il commit e ripubblica l'API con i dati aggiornati.

services:
  # --------------------------------------------------------------------
  # API read-only
  # --------------------------------------------------------------------
  - type: web
    name: trading-floor-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # Il database aggiornato dal workflow dopo ogni ciclo
      - key: ACCOUNTS_DB
        value: data/accounts.db

      # Prezzi correnti delle posizioni; senza, l'API usa l'ultimo prezzo scambiato.
      # Inserita a mano nel dashboard, non sta nel repository.
      - key: MASSIVE_API_KEY
        sync: false

      # Origini ammesse dal CORS. Aggiorna con l'URL reale del sito statico
      # dopo il primo deploy.
      - key: ALLOWED_ORIGINS
        value: https://trading-floor-s5tt.onrender.com

  # --------------------------------------------------------------------
  # Frontend statico
  # --------------------------------------------------------------------
  - type: web
    name: trading-floor
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Vite inietta le variabili VITE_* al momento della build.
      # In sviluppo resta vuota e vale il proxy di vite.config.ts.
      - key: VITE_API_BASE
        value: https://trading-floor-api.onrender.com
    routes:
      # SPA: qualunque path ricade su index.html
      - type: rewrite
        source: /*
        destination: /index.html
