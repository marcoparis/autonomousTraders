# Render Blueprint: deploy "vetrina" a costo zero.
#
# Cosa mette online:
#   - il frontend Vite come Static Site (gratis, sempre acceso, niente spin-down)
#   - l'API FastAPI in sola lettura come Web Service free
#
# Cosa NON mette online: il motore con gli agenti LLM. Non fa parte della demo:
# i dati mostrati sono simulati (backend/demo_seed.py). Come renderlo reale, e
# perche' su Render free non gira, e' spiegato in COME_RENDERLO_REALE.txt.

services:
  # --------------------------------------------------------------------
  # API read-only
  # --------------------------------------------------------------------
  - type: web
    name: trading-floor-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # Il database della demo, committato nel repo. E' anche il default del
      # codice: la riga c'e' per renderlo esplicito.
      - key: ACCOUNTS_DB
        value: data/accounts.db

      # Nome del "modello" mostrato in dashboard: nella demo i dati sono simulati
      - key: MODEL_LABEL
        value: Simulato

      # Origini ammesse dal CORS. Aggiorna con l'URL reale del sito statico
      # dopo il primo deploy.
      - key: ALLOWED_ORIGINS
        value: https://trading-floor-s5tt.onrender.com

  # --------------------------------------------------------------------
  # Frontend statico
  # --------------------------------------------------------------------
  - type: web
    name: trading-floor
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Vite inietta le variabili VITE_* al momento della build.
      # In sviluppo resta vuota e vale il proxy di vite.config.ts.
      - key: VITE_API_BASE
        value: https://trading-floor-api.onrender.com
    routes:
      # SPA: qualunque path ricade su index.html
      - type: rewrite
        source: /*
        destination: /index.html
