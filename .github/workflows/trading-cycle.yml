# Fa girare UN ciclo di trading all'ora, gratis, senza nessun server sempre acceso.
#
# Come funziona:
#   1. GitHub Actions clona il repo su un runner temporaneo (Python e Node
#      sono gia' preinstallati su ubuntu-latest).
#   2. Installa le dipendenze e lancia backend/trading_floor.py con RUN_ONCE=true:
#      un solo giro dei 4 trader, poi il processo esce da solo.
#   3. Il ciclo scrive su data/accounts.db. Il job lo ricommitta nel repo.
#   4. Render ha "autoDeploy: true" su entrambi i servizi (vedi render.yaml),
#      quindi il push fa ripartire l'API con i dati freschi in automatico.
#
# Costo: zero. I runner di GitHub Actions sono gratuiti senza limiti sui repo
# pubblici; sui privati il piano free da' 2000 minuti/mese, e un ciclo qui
# dura qualche minuto (i trader girano uno alla volta), quindi anche ogni ora si resta ben sotto la soglia.
#
# Setup richiesto, una tantum:
#   Settings del repo -> Secrets and variables -> Actions -> New repository
#   secret, per ognuna delle chiavi elencate sotto "env:".
#   Settings -> Actions -> General -> Workflow permissions -> "Read and write
#   permissions", altrimenti il job non puo' pushare il commit del punto 3.

name: Trading cycle

on:
  # Cron DISATTIVATO: la demo pubblicata usa dati simulati (backend/demo_seed.py) e
  # non ha un modello configurato. Per riattivare gli aggiornamenti automatici
  # togli il commento, imposta i secrets e la variabile TRADER_MODEL (vedi sotto).
  # schedule:
  #   - cron: "0 15,20 * * 1-5"   # 2 volte al giorno, lun-ven, 15:00 e 20:00 UTC
  workflow_dispatch: {}     # bottone "Run workflow" nella tab Actions, per test

# Evita che due esecuzioni si sovrappongano se un ciclo dura piu' di un'ora.
concurrency:
  group: trading-cycle
  cancel-in-progress: false

permissions:
  contents: write   # serve per ricommittare data/accounts.db

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa uv
        run: pip install uv

      - name: Installa le dipendenze
        run: uv sync

      - name: Esegui un ciclo di trading
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # non serve con Gemini
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TRADER_MODEL: ${{ vars.TRADER_MODEL || 'gpt-5.4-mini' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Facoltativa: senza, i prezzi arrivano dal simulatore, a costo zero.
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          RUN_ONCE: "true"
          RUN_EVEN_WHEN_MARKET_IS_CLOSED: "true"
          ACCOUNTS_DB: data/accounts.db
        run: uv run -m backend.trading_floor

      - name: Ricommitta il database aggiornato
        run: |
          git config user.name "trading-floor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/accounts.db
          git diff --cached --quiet && echo "Nessuna modifica" || git commit -m "Trading cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
