[project]
name = "autonomous-traders"
version = "0.1.0"
description = "Agenti AI che fanno trading con prezzi di mercato reali: motore, API FastAPI e dashboard Vite"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.38,<1",
    "python-dotenv>=1.1,<2",
    "pydantic>=2.11,<3",
    "openai-agents>=0.22,<1",
    "mcp>=1.19,<2",
    "massive>=2.8,<3",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
