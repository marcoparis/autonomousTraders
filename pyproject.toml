[project]
name = "autonomous-traders"
version = "0.1.0"
description = "Demo di una trading floor con tre trader simulati: API FastAPI e dashboard Vite"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# Solo cio' che serve alla demo. Le dipendenze del motore reale (agenti, MCP, prezzi)
# sono elencate in COME_RENDERLO_REALE.txt, punto 3.1.
dependencies = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.38,<1",
    "python-dotenv>=1.1,<2",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
